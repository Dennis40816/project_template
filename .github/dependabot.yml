version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      avalonia:
        patterns: ["Avalonia*"]
      test:
        patterns: ["xunit*"]
    ignore:
      # Avalonia.Headless.XUnit does not discover [AvaloniaFact] tests under xUnit v4 yet.
      - dependency-name: "xunit.v3"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
